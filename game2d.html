<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>인생라멘 2D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Song+Myung&family=Yuji+Syuku&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #140d08; overflow: hidden; font-family: "Jua", sans-serif; font-synthesis: none; color: #2b211b; user-select: none; -webkit-user-select: none; }
  #wrap { position: absolute; left: 50%; top: 50%; width: 1280px; height: 714px; transform-origin: 0 0; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: #1d130c; }
  img { -webkit-user-drag: none; }
  .hidden { display: none !important; }

  /* 두 화면(앞: 손님·조리대 / 뒤: 면 솥·육수·그릴)이 옆으로 밀리며 바뀜 */
  #views { position: absolute; inset: 0; width: 2560px; display: flex; transition: transform .35s cubic-bezier(.4,.1,.2,1); }
  #views.back { transform: translateX(-1280px); }
  .view { position: relative; width: 1280px; height: 714px; flex: none; overflow: hidden; }
  .bg { position: absolute; inset: 0; background: url(img/bg2d/front.jpg?v=6) 0 0 / 1280px 714px; }
  .frontClip { clip-path: inset(437px 0 0 0); z-index: 3; pointer-events: none; }
  .vig { position: absolute; inset: 0; pointer-events: none; z-index: 9; background: radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 58%, rgba(20,10,4,.42) 100%); }

  /* 손님 */
  canvas.cust { position: absolute; top: 26px; width: 400px; height: 400px; z-index: 2; pointer-events: none; }
  .seatHit { position: absolute; top: 120px; width: 230px; height: 300px; z-index: 6; cursor: pointer; border-radius: 30px; }
  .seatHit.serveable { box-shadow: inset 0 0 0 4px rgba(255,214,102,.85); background: rgba(255,214,102,.08); }
  .ticket { position: absolute; top: 4px; width: 224px; z-index: 7; background: #fffaf0; border-radius: 4px 4px 10px 10px; padding: 8px 10px 9px; box-shadow: 0 5px 12px rgba(0,0,0,.4); font-size: 15px; line-height: 1.35; transition: opacity .3s, transform .3s; }
  .ticket::before { content: ''; position: absolute; top: -5px; left: 50%; margin-left: -18px; width: 36px; height: 10px; background: #c6c6cc; border-radius: 3px; }
  .ticket b { font-size: 18px; } .ticket .firm { color: #b8322a; } .ticket .add { color: #2f7a3a; } .ticket .del { color: #9a8a7a; text-decoration: line-through; }
  .ticket .tops { display: flex; flex-wrap: wrap; gap: 3px 4px; margin-top: 4px; }
  .ticket .tp { display: inline-flex; align-items: center; gap: 1px; background: #f3ead8; border-radius: 6px; padding: 0 5px 0 2px; font-size: 14px; line-height: 22px; }
  .ticket .tp img { width: 20px; height: 20px; }
  .ticket .tp.add { background: #dff0dc; color: #2f7a3a; }
  .ticket .tp.del { background: #eee; color: #9a8a7a; text-decoration: line-through; }
  .ticket .tp.del img { opacity: .4; filter: grayscale(1); }
  .ticket .bar { height: 6px; background: #e6dcc8; border-radius: 3px; margin-top: 6px; overflow: hidden; } .ticket .bar i { display: block; height: 100%; border-radius: 3px; }
  .bubble { position: absolute; z-index: 8; background: #fffdf6; border: 3px solid #3a2a20; border-radius: 16px; padding: 5px 12px; font-size: 17px; max-width: 260px; box-shadow: 0 3px 0 rgba(0,0,0,.2); pointer-events: none; animation: pop .18s ease-out; }
  .bubble::after { content: ''; position: absolute; left: 22px; bottom: -11px; border: 8px solid transparent; border-top-color: #3a2a20; }
  .bubble.happy { border-color: #2f7a3a; } .bubble.happy::after { border-top-color: #2f7a3a; }
  .bubble.angry { border-color: #b8322a; background: #fff3ee; } .bubble.angry::after { border-top-color: #b8322a; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }

  /* 조리대 (앞 화면 아래쪽) */
  #work { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
  #work > * { pointer-events: auto; }
  /* 작업대 그림 속 물건 위에 겹치는 누르는 자리 */
  .hot { position: absolute; cursor: pointer; border-radius: 16px; transition: background .12s, box-shadow .12s; }
  .hot:hover { background: rgba(255,230,160,.16); box-shadow: 0 0 0 3px rgba(255,214,102,.65); }
  .hot .lbl { bottom: -8px; }
  .hot .key { position: absolute; left: 4px; top: 2px; background: rgba(28,16,8,.82); color: #f6ecd8; width: 20px; height: 20px; border-radius: 50%; font-size: 12px; text-align: center; line-height: 20px; }
  .hot.locked { cursor: default; background: rgba(20,12,6,.55); }
  .hot.locked:hover { box-shadow: none; }
  .hot.locked .lbl { opacity: .8; }
  .bin .lbl { bottom: -6px; font-size: 12px; padding: 0 6px; }
  /* 아래 띠 (서랍 앞): 날짜·돈 · 면 바구니 상태 · 버튼 */
  .bar { position: absolute; left: 10px; right: 10px; bottom: 4px; display: flex; align-items: center; gap: 10px; }
  .panel { background: rgba(28,16,8,.86); color: #f6ecd8; border-radius: 10px; padding: 3px 12px; font-size: 14px; white-space: nowrap; display: flex; gap: 14px; align-items: center; }
  .panel .big { font-size: 16px; } .panel img { width: 18px; height: 18px; vertical-align: -4px; }
    .lbl { position: absolute; left: 50%; transform: translateX(-50%); bottom: -4px; background: rgba(28,16,8,.82); color: #f6ecd8; font-size: 13px; padding: 1px 8px; border-radius: 6px; white-space: nowrap; pointer-events: none; }
  .slot { position: absolute; top: 548px; width: 122px; height: 100px; border-radius: 50%; cursor: pointer; }
  .slot.empty { background: radial-gradient(ellipse at 50% 60%, rgba(0,0,0,.18) 0 52%, transparent 54%); }
  .slot.empty::after { content: '그릇 자리'; position: absolute; left: 0; right: 0; top: 38px; text-align: center; color: rgba(255,240,220,.45); font-size: 14px; }
  .slot.active .bowl { filter: drop-shadow(0 0 6px #ffd666) drop-shadow(0 0 2px #ffd666); }
  .slot .num { position: absolute; left: 6px; top: 0; background: rgba(28,16,8,.8); color: #f6ecd8; border-radius: 50%; width: 22px; height: 22px; text-align: center; font-size: 14px; line-height: 22px; z-index: 2; }
  .slot .state { position: absolute; left: 50%; transform: translateX(-50%); bottom: -10px; font-size: 12px; background: rgba(28,16,8,.82); color: #f6ecd8; padding: 1px 8px; border-radius: 6px; white-space: nowrap; }

  /* 그릇: 위에서 비스듬히 본 모양 (테두리·국물·면·토핑) */
  .bowl { position: absolute; left: 0; top: 2px; width: 150px; height: 112px; pointer-events: none; transform: scale(.8); transform-origin: 0 0; }
  .bowl .body { position: absolute; left: 6px; right: 6px; top: 34px; bottom: 0; border-radius: 0 0 70px 70px / 0 0 62px 62px; background: linear-gradient(#fbf6ee, #d9cfc2); box-shadow: inset 0 -6px 10px rgba(0,0,0,.12); }
  .bowl .body::after { content: ''; position: absolute; left: 10%; right: 10%; top: 22px; height: 7px; background: repeating-linear-gradient(90deg, #b8322a 0 10px, transparent 10px 16px); opacity: .75; border-radius: 4px; }
  .bowl .rim { position: absolute; left: 0; right: 0; top: 0; height: 70px; border-radius: 50%; background: radial-gradient(ellipse at 50% 50%, #e9e1d4 0 62%, #fffdf8 66%, #e8dfd2 100%); box-shadow: 0 2px 0 #cfc4b5; }
  .bowl .soup { position: absolute; left: 11px; right: 11px; top: 8px; height: 52px; border-radius: 50%; }
  .bowl .noodle { position: absolute; left: 30px; right: 30px; top: 16px; height: 34px; border-radius: 50%; background: repeating-linear-gradient(170deg, #f3d77f 0 3px, #e2bd5a 3px 5px, #f7e3a0 5px 7px); box-shadow: 0 0 0 2px rgba(240,210,120,.5); }
  .bowl .noodle.rinsed { background: repeating-linear-gradient(170deg, #fbecb8 0 3px, #eed08a 3px 5px, #fff6d6 5px 7px); box-shadow: 0 0 0 2px rgba(170,215,240,.8), 0 0 8px rgba(170,215,240,.7); }
  .bowl .tp { position: absolute; width: 38px; height: 38px; }
  .bowl .veg { position: absolute; left: 46px; top: 10px; width: 58px; height: 40px; border-radius: 50% 50% 40% 40%; background: radial-gradient(circle at 30% 40%, #8bc34a 0 18%, transparent 19%), radial-gradient(circle at 65% 35%, #a5d66b 0 16%, transparent 17%), radial-gradient(circle at 50% 70%, #f3f0d8 0 30%, transparent 31%), radial-gradient(circle at 25% 75%, #e8b07a 0 14%, transparent 15%), radial-gradient(ellipse at 50% 55%, #e9e2c0, #cdbf8e); box-shadow: 0 3px 4px rgba(0,0,0,.25); }
  .bowl .veg.burnt { filter: brightness(.45) saturate(.6); } .bowl .veg.raw { filter: saturate(1.6) brightness(1.1); }
  .bowl .tp.butter { left: 60px; top: 2px; width: 30px; height: 30px; }
  /* 츠케멘 쟁반 */
  .bowl .tray { position: absolute; left: -4px; right: -6px; top: 26px; height: 82px; border-radius: 12px; background: linear-gradient(#3e2619, #24150d); box-shadow: inset 0 0 0 3px #6b2a1e, 0 4px 6px rgba(0,0,0,.35); }
  .bowl .plate { position: absolute; left: 2px; top: 22px; width: 100px; height: 66px; border-radius: 50%; background: radial-gradient(ellipse at 50% 45%, #fdfbf6 0 58%, #e9e3d8 64%, #2f5f9a 66% 69%, #f4efe6 71%); box-shadow: 0 3px 4px rgba(0,0,0,.3); }
  .bowl .tnoodle { position: absolute; left: 16px; top: 28px; width: 72px; height: 48px; border-radius: 48% 52% 44% 46%; background: repeating-linear-gradient(160deg, #fbecb8 0 3px, #eed08a 3px 5px, #fff6d6 5px 7px); box-shadow: 0 0 0 2px rgba(170,215,240,.75), 0 0 8px rgba(170,215,240,.6); }
  .bowl .dip { position: absolute; right: -2px; top: 36px; width: 52px; height: 52px; border-radius: 50%; background: radial-gradient(circle, #f4efe6 0 62%, #d8cfc2 64%, #a83a2a 66% 70%, #efe7da 72%); box-shadow: 0 3px 4px rgba(0,0,0,.35); }
  .bowl .dsoup { position: absolute; left: 9px; top: 9px; width: 34px; height: 34px; border-radius: 50%; }
  .bowl .trayimg { position: absolute; left: -6px; top: 24px; width: 164px; height: 82px; filter: drop-shadow(0 4px 4px rgba(0,0,0,.35)); }
  .bowl .tp.sm { width: 30px; height: 30px; }
  .bowl .tp.chashu.sm { width: 36px; height: 36px; }
  .bowl .tp.chashu { width: 46px; height: 46px; }
  .bowl .tag { position: absolute; left: 50%; transform: translateX(-50%); top: -6px; font-size: 12px; background: #b8322a; color: #fff; padding: 0 6px; border-radius: 6px; white-space: nowrap; }

  .jar { position: absolute; top: 100px; width: 84px; height: 100px; cursor: pointer; text-align: center; }
  .jar img { width: 70px; height: 70px; }
  .tray { position: absolute; left: 736px; top: 100px; display: grid; grid-template-columns: repeat(3, 64px); gap: 6px; background: rgba(28,16,8,.55); border-radius: 14px; padding: 6px; }
  .tslot { width: 64px; height: 64px; border-radius: 12px; background: #fff7e8; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; position: relative; cursor: pointer; transition: transform .08s; }
  .tslot:active { transform: scale(.94); }
  .tslot img { width: 36px; height: 36px; }
  .tslot small { position: absolute; left: 6px; top: 3px; color: #8a7a6a; font-size: 12px; }
  .tslot.off { opacity: .35; pointer-events: none; }
  .side { position: absolute; right: 16px; top: 16px; width: 214px; display: flex; flex-direction: column; gap: 10px; }
  .bar .btn { padding: 5px 12px; font-size: 15px; box-shadow: 0 3px 0 #7a1e18; } .bar .btn.dark { box-shadow: 0 3px 0 #2a1e16; } .bar .btn small { display: inline; margin-left: 6px; }
  .mini { display: flex; gap: 4px; background: rgba(28,16,8,.86); border-radius: 10px; padding: 3px; }
  .mini div { min-width: 64px; }
  .btn { all: unset; cursor: pointer; background: #c8392e; color: #fff; padding: 12px 14px; border-radius: 12px; font-size: 19px; box-shadow: 0 4px 0 #7a1e18; text-align: center; transition: transform .06s; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #7a1e18; }
  .btn.green { background: #2f7a3a; box-shadow: 0 4px 0 #1a4a22; }
  .btn.dark { background: #4a3a2e; box-shadow: 0 4px 0 #2a1e16; font-size: 16px; padding: 9px 12px; }
  .btn small { display: block; font-size: 12px; opacity: .8; }
    .mini div { background: #3a2a20; color: #f6ecd8; border-radius: 6px; font-size: 12px; text-align: center; padding: 1px 6px; line-height: 1.25; white-space: nowrap; }

  /* 뒤 주방 */
  .kitchen { position: absolute; inset: 0; background: url(img/bg2d/kitchen.jpg?v=8) 0 0 / 1280px 714px, #3a2a20; }
  .spot { position: absolute; cursor: pointer; }
  /* 면 솥 상태판 (해면기 위 벽에 한 줄) */
  .basket { width: 72px; height: 86px; border-radius: 12px; color: #fff; font-size: 12px; text-shadow: 0 2px 3px rgba(0,0,0,.7); background: rgba(28,16,8,.62); }
  .basket:hover, .basket.hl { background: rgba(120,80,20,.75); box-shadow: 0 0 0 3px rgba(255,214,102,.7); }
  .basket .ring { position: absolute; left: 10px; top: 4px; width: 52px; height: 52px; border-radius: 50%; background: rgba(0,0,0,.25); }
  .basket .no { position: absolute; top: 1px; left: 2px; background: rgba(28,16,8,.92); width: 18px; height: 18px; border-radius: 50%; text-align: center; line-height: 18px; font-size: 11px; }
  .basket .nood { position: absolute; left: 18px; top: 12px; width: 36px; height: 36px; opacity: .25; transition: opacity .2s; }
  .basket.on .nood { opacity: 1; }
  .basket .t { position: absolute; top: 62px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 11px; }
  .station { position: absolute; border-radius: 16px; }
  .station.locked { background: rgba(15,9,4,.5); }
  .station.open { cursor: pointer; }
  /* 웍 볶는 모션 */
  #wokAnim { position: absolute; left: 730px; top: 270px; width: 300px; height: 260px; pointer-events: none; z-index: 5; opacity: 0; transition: opacity .25s;
    -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 72%, transparent 100%); mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 72%, transparent 100%); }
  #wokAnim.on { opacity: 1; }
  .station .wokg { position: absolute; left: 50%; top: -168px; transform: translateX(-50%); width: 180px; }
  .station#wokSpot .lbl { top: auto; bottom: -14px; transform: translateX(-50%); }
  .station#wokSpot { z-index: 6; } /* 웍 영상(z 5) 위로 게이지·글씨가 보이게 */
  .station#wokSpot.on, .station#wokSpot.on:hover { background: none; box-shadow: none; }
  .station.open:hover { background: rgba(160,215,245,.22); box-shadow: 0 0 0 3px rgba(140,200,240,.8); }
  .rinseFx { position: absolute; left: 40px; top: 450px; z-index: 20; background: rgba(40,110,170,.92); color: #fff; padding: 6px 14px; border-radius: 10px; font-size: 18px; animation: pop .2s, fadeUp 1.2s forwards; pointer-events: none; }
  @keyframes fadeUp { 70% { opacity: 1; } to { opacity: 0; transform: translateY(-30px); } }
  .station .lbl { bottom: auto; top: 50%; transform: translate(-50%, -50%); font-size: 13px; }
  .tebo { position: absolute; cursor: pointer; border-radius: 14px; }
  .tebo:hover { background: rgba(255,230,160,.2); box-shadow: 0 0 0 2px rgba(255,214,102,.7); }
  .tebo b { position: absolute; left: 50%; top: -4px; transform: translateX(-50%); background: rgba(28,16,8,.88); color: #f6ecd8; width: 20px; height: 20px; border-radius: 50%; font-size: 12px; text-align: center; line-height: 20px; font-weight: normal; }
  .pot { width: 124px; height: 170px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; border-radius: 24px; }
  .pot:hover { background: rgba(255,230,160,.18); }
  .pot.locked { cursor: default; background: rgba(20,12,6,.5); }
  .pot.locked:hover { background: rgba(20,12,6,.5); }
  .pot .t, .grill .t { background: rgba(28,16,8,.85); color: #f6ecd8; padding: 3px 12px; border-radius: 8px; font-size: 16px; white-space: nowrap; }
  .grill { position: absolute; width: 200px; height: 190px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 4px; border-radius: 20px; cursor: pointer; }
  .grill:hover { background: rgba(255,230,160,.14); }
  .gauge { width: 220px; height: 16px; border-radius: 8px; background: #3a2a20; position: relative; overflow: hidden; border: 2px solid #1e140d; }
  .gauge .ok { position: absolute; top: 0; bottom: 0; background: #4caf50; }
  .gauge .needle { position: absolute; top: -2px; bottom: -2px; width: 4px; background: #fff; box-shadow: 0 0 4px #000; }
  .meat { position: absolute; left: 64px; top: 34px; width: 70px; height: 70px; transition: filter .1s, opacity .2s; opacity: .55; pointer-events: none; }
  .grill.on .meat { opacity: 1; }
  .grill .gauge { width: 190px; margin-top: -26px; }

  /* 공통 */
  #hand { position: absolute; z-index: 30; pointer-events: none; width: 64px; height: 64px; margin: -20px 0 0 -10px; filter: drop-shadow(0 4px 4px rgba(0,0,0,.5)); }
  #handTxt { position: absolute; z-index: 30; left: 50%; bottom: 286px; transform: translateX(-50%); background: rgba(28,16,8,.86); color: #f6ecd8; padding: 4px 14px; border-radius: 10px; font-size: 16px; pointer-events: none; }
  #toast { position: absolute; left: 50%; top: 92px; transform: translateX(-50%); z-index: 40; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
  #toast div { background: rgba(28,16,8,.9); color: #f6ecd8; padding: 7px 16px; border-radius: 10px; font-size: 17px; animation: pop .2s; }
  #toast div.warn { background: #8a4a12; } #toast div.good { background: #2f7a3a; } #toast div.bad { background: #8a1e18; }
  .overlay { position: absolute; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: rgba(15,8,4,.72); }
  .card { width: 520px; background: #fffaf0; border-radius: 18px; padding: 26px 30px; box-shadow: 0 12px 30px rgba(0,0,0,.5); text-align: center; }
  .card .ver { font-size: 12px; color: #9a8a78; margin-top: 10px; }
  .card h1 { margin: 0 0 4px; font-size: 40px; } .card .jp { font-family: "Yuji Syuku", serif; color: #b8322a; font-size: 18px; }
  .card p { font-size: 17px; line-height: 1.6; margin: 12px 0; color: #4a3a2e; }
  .card table { width: 100%; font-size: 18px; margin: 10px 0 18px; border-collapse: collapse; } .card td { padding: 4px 6px; border-bottom: 1px dashed #e2d6c2; } .card td:last-child { text-align: right; }
  .keys { font-size: 14px; color: #8a7a6a; margin-top: 12px; }
  .card .how { font-size: 15px; text-align: left; background: #f3ead8; border-radius: 12px; padding: 10px 14px; }
  /* 제목 화면: 가게 앞 화면 위에 로고 · 손님 2명 · 버튼 */
  #stage.titling #work, #stage.titling .seatHit, #stage.titling .ticket, #stage.titling .bubble { visibility: hidden; }
  /* 제목 화면: 3D판과 같은 정체성 — 「人生らーめん」 · 人生 도장 · 할아버지의 비법 노트 */
  #title { position: absolute; inset: 0; z-index: 60; color: #f6ecd8; transition: opacity .6s; overflow: hidden; }
  #title.out { opacity: 0; pointer-events: none; }
  #title .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(14,7,3,.94) 0, rgba(14,7,3,.86) 36%, rgba(14,7,3,.25) 56%, rgba(14,7,3,0) 70%), linear-gradient(rgba(14,7,3,0) 60%, rgba(14,7,3,.55)); }
  #title .glow { position: absolute; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(rgba(255,150,70,.32), rgba(255,120,40,0) 65%); mix-blend-mode: screen; animation: lantern 3.2s ease-in-out infinite alternate; pointer-events: none; }
  @keyframes lantern { from { opacity: .55; transform: scale(.94); } to { opacity: 1; transform: scale(1.04); } }
  #title .steam { position: absolute; width: 46px; height: 120px; border-radius: 50%; background: radial-gradient(ellipse, rgba(255,255,255,.34), rgba(255,255,255,0) 70%); filter: blur(5px); animation: steam 3.6s ease-in infinite; pointer-events: none; }
  @keyframes steam { 0% { transform: translateY(20px) scaleX(.7); opacity: 0; } 30% { opacity: .9; } 100% { transform: translateY(-110px) scaleX(1.5); opacity: 0; } }
  #title .side { position: absolute; left: 76px; top: 0; bottom: 0; width: 480px; display: flex; flex-direction: column; justify-content: center; }
  #title .jp { white-space: nowrap; font-family: "Yuji Syuku", serif; font-size: 68px; line-height: 1.05; color: #fbeed2; letter-spacing: 2px; text-shadow: 0 4px 18px rgba(0,0,0,.6); animation: rise .9s ease-out both; }
  #title .kr { display: flex; align-items: center; gap: 14px; margin-top: 16px; animation: rise .9s .15s ease-out both; }

// 웍 볶는 영상(힉스필드 Seedance → 45장 묶음): 배경 그림의 웍 자리에 그대로 겹쳐 재생, 가장자리는 흐리게
const WOK_CLIP = { src: 'img/bg2d/wok_toss.jpg?v=2', n: 43, cols: 8, w: 298, h: 253, fade: 4 };
function startWokAnim(cv) {
  const ctx = cv.getContext('2d'), C = WOK_CLIP;
  if (!C.img) { C.img = new Image(); C.img.src = C.src; }
  let f = 0, last = 0;
  const cell = (i, a) => { ctx.globalAlpha = a; ctx.drawImage(C.img, (i % C.cols) * C.w, Math.floor(i / C.cols) * C.h, C.w, C.h, 0, 0, C.w, C.h); };
  (function loop(t) {
    if (!cv.isConnected) return;
    requestAnimationFrame(loop);
    const on = G.wok?.on;
    if (!on) { f = 0; return; } // 손 떼면 처음 장면부터 다시
    if (t - last < 1000 / 12 || !C.img.complete) return;
    last = t; ctx.clearRect(0, 0, C.w, C.h); cell(f, 1);
    const j = f - (C.n - C.fade); if (j >= 0) cell(j, (j + 1) / (C.fade + 1)); // 끝 몇 장은 처음 장면과 겹쳐 이음매 숨김
    ctx.globalAlpha = 1; f = f + 1 >= C.n ? C.fade : f + 1;
  })(0);
}

function makeOrder() {

  G.recent.push(ramen);
  const base = RAMEN[ramen].base.filter(k => on.includes(k)), top = new Set(base);
  const r = Math.random(), firm = r < 0.4 ? 'katame' : r < 0.8 ? 'futsu' : 'yawa';
  if (on.includes('ajitama') && Math.random() < 0.4) top.add('ajitama');
  if (Math.random() < 0.2) top.delete('negi');
  if (on.includes('corn') && !base.includes('corn') && Math.random() < 0.12) top.add('corn');

  looks.push({ kind: 'student' });
  for (const P of PEOPLE) if (STILL[P.id]) looks.push({ still: P.id, kind: P.vv === 'om' ? 'grandpa' : P.vv === 'of' ? 'grandma' : P.vv === 'st' ? 'student' : P.female ? 'woman' : 'man', P });
  for (let i = looks.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [looks[i], looks[j]] = [looks[j], looks[i]]; }
  return looks;
}
function customerVoice(kind, P) {
  const K = P ? { female: P.female, vv: P.vv } : KINDS[kind], old = P ? P.old : kind === 'grandpa' || kind === 'grandma', own = Voices.byGender(K.female);
  const pitch = own ? rand(0.92, 1.08) : K.female ? rand(1.15, 1.3) : rand(0.75, 0.9);
  return { vv: K.vv + Math.floor(Math.random() * VV_CAST[K.vv]), voice: own ?? Voices.random(), pitch: old ? pitch * 0.9 : pitch, rate: old ? rand(0.85, 0.92) : rand(0.98, 1.12), fileRate: rand(0.97, 1.03) };
}
function spawnCustomer() {

function ticketHtml(c) { // 주문표: 토핑은 그림 + 이름 (추가는 +초록, 뺀 건 줄 그음)
  const o = c.order, on = dayCfg().tops, base = RAMEN[o.ramen].base.filter(k => on.includes(k));

  const want = on.filter(k => o.top.has(k)).map(k => base.includes(k) ? chip(k, '') : chip(k, 'add', '+'));
  const del = base.filter(k => !o.top.has(k)).map(k => chip(k, 'del'));

}
function evaluate(c, b) {
  const issues = []; let m = 0;
  if (!b.broth) { issues.push('육수가 없어요!'); m += 3; }
  else if (b.kind() !== c.order.ramen) { issues.push(`${RAMEN[c.order.ramen].name} 시켰는데 ${josa(RAMEN[b.kind()].name, '이에요', '예요')}!`); m += 3; }
  if (b.noodles == null) { issues.push('면이 없어요!'); m += 3; }
  else { const f = firmOf(b.noodles), d = firmPenalty(c.order.firm, f); if (d) { issues.push(`${FIRM[c.order.firm]} 주문인데 면이 ${FIRM_ALL[f]}`); m += d; } }
  if (b.chashu.length !== c.order.chashu) { issues.push(`챠슈 ${c.order.chashu}장 주문인데 ${b.chashu.length}장`); m += 1; }
  if (c.order.wok && !b.wok) { issues.push('볶은 야채가 빠졌어요'); m += 1; }
  else if (c.order.wok && b.wok !== 'good') { issues.push(b.wok === 'raw' ? '야채가 덜 볶였어요' : '야채가 탔어요'); m += 1; }
  else if (!c.order.wok && b.wok) { issues.push('이 라멘엔 볶은 야채를 안 올려요'); m += 1; }
  if (b.chashu.some(q => q !== 'good')) { issues.push(b.chashu.includes('burnt') ? '챠슈가 탔어요' : '챠슈가 덜 구워졌어요'); m += 1; }
  for (const k of Object.keys(TOPPINGS)) {
    const want = c.order.top.has(k), has = b.top.has(k);
    if (want && !has) { issues.push(`${josa(TOPPINGS[k], '이', '가')} 빠졌어요`); m += 1; }
    if (!want && has) { issues.push(RAMEN[c.order.ramen].base.includes(k) ? `${TOPPINGS[k]} 빼 달라고 했는데…` : `${josa(TOPPINGS[k], '은', '는')} 안 시켰어요`); m += 1; }
  }
  const r = c.patience / c.max, timeScore = r > 0.45 ? 3 : r > 0.15 ? 2 : 1;

  else { say(c, `😠 ${issues.slice(0, 2).join('<br>')}`, 'angry'); Sound.angry(); c.shake = 0.6; }
}

function drawCustomer(i, c, dt) {

  const cl = clipFor(c);

      <p class="sub">할아버지가 남긴 골목 라멘집, 그리고 비어 있는 마지막 한 장</p>
      <div class="note"><div class="q">「너만의 <b>인생 라멘</b>을<br>찾아라.」</div><div class="by">— 할아버지의 비법 노트, 마지막 장</div></div>
      <div class="menu">${cont ? `<button class="btn green" id="tContinue">이어하기<small>Day ${save.day} · ¥${save.money.toLocaleString()}</small></button><button class="sub2" id="tReset">처음부터 하기</button>`
        : `<button class="btn" id="tNew">가게 문 열기<small>할아버지의 가게, 오늘부터 내가</small></button>`}</div>
    </div>
    <div class="tap">${FINE_POINTER ? '마우스로 누르고 · 키보드 단축키도 돼요' : '화면을 눌러서 해요 · 가로로 보면 더 커요'}</div>
    <div class="ver">그림 Higgsfield · 목소리 VOICEVOX<br>${APP_VERSION} · ${APP_DATE}</div>`;
  const go = () => { Sound.init(); Sound.wake?.(); T.classList.add('out'); setTimeout(() => T.classList.add('hidden'), 500); G.title = false; $('stage').classList.remove('titling'); newDay(); showStart(); };
  if (cont) {
    $('tContinue').onclick = go;
    $('tReset').onclick = e => { const b = e.currentTarget; if (!b.classList.contains('warn')) { b.classList.add('warn'); b.textContent = '정말요? 기록이 지워져요 — 한 번 더 누르면 Day 1부터'; return; } store.set('ramen2d', { day: 1, money: 0 }); go(); };
  } else $('tNew').onclick = go;
}
function endDay() {
  if (G.ended) return; G.ended = true; G.running = false; Sound.setBoil(0); Sound.setSizzle(false);
  const profit = G.earned - G.cost;
  store.set('ramen2d', { day: G.day + 1, money: G.money - G.cost });
  $('over').classList.remove('hidden');
  $('over').innerHTML = `<div class="card"><div class="jp">本日の営業終了</div><h1>Day ${G.day} 마감</h1>
    <table><tr><td>😊 만족</td><td>${G.res.happy}명</td></tr><tr><td>😐 보통</td><td>${G.res.normal}명</td></tr><tr><td>😠 화남</td><td>${G.res.angry}명</td></tr>
    <tr><td>매출</td><td>¥${G.earned.toLocaleString()}</td></tr><tr><td>재료비</td><td>−¥${G.cost.toLocaleString()}</td></tr><tr><td><b>오늘 번 돈</b></td><td><b>¥${profit.toLocaleString()}</b></td></tr></table>
    <button class="btn green" id="next" style="display:inline-block;padding:14px 40px;font-size:22px">다음 날로</button></div>`;
  $('next').onclick = () => { newDay(); showStart(); };
}

// ================= 키보드 =================
addEventListener('keydown', e => {
  if (!G?.running) return;
  if (e.code === 'Space') { e.preventDefault(); setView(!G.back); return; }
  if (e.key === 'Escape') { dropHand(); return; }
  if (e.key === 'z' || e.key === 'Z' || e.key === 'Backspace') { e.preventDefault(); undoBowl(); return; }
  if ((e.key === 'r' || e.key === 'R') && stationOpen('sink')) { rinseNoodles(); return; }
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 9) { // 숫자: 뒤 주방에선 테보 1~4, 앞 화면에선 토핑 1~6
    if (G.back) { if (n <= G.baskets.length) clickBasket(n - 1); return; }
    const k = dayCfg().tops[n - 1]; if (k) addTopping(k); return;
  }
  const qi = 'qwe'.indexOf(e.key.toLowerCase()); if (qi >= 0) clickSlot(qi);
});
addEventListener('contextmenu', e => { e.preventDefault(); if (G?.running) dropHand(); });
$('toBack').onclick = () => setView(true); $('toFront').onclick = () => setView(false);
$('trashF').onclick = $('trashB').onclick = () => dropHand();
$('undoF').onclick = () => undoBowl();
$('stack').onclick = () => placeBowl();
$('misoJar').onclick = () => { if (dayCfg().menu.some(r => RAMEN[r].miso)) addMiso(); };
$('tareSpot').onclick = () => toast('타레는 육수 솥에 미리 섞어 두었어요 — 육수만 부으면 돼요');
document.addEventListener('pointerdown', () => Sound.wake?.());

// ================= 시작 =================
buildSeats();
loadArt().then(() => { newDay(); showTitle(); requestAnimationFrame(frame); });
window.__g = { get G() { return G; }, spawnCustomer, CLIPS };
</script>
</body></html>
